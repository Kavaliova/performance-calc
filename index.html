<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Score Calculator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 32px 16px; }
  .container { max-width: 680px; margin: 0 auto; background: #fff; border-radius: 16px; border: 1px solid #e0dfd8; padding: 32px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #1a1a18; }
  .subtitle { font-size: 13px; color: #6b6a63; margin-bottom: 28px; }

  .tabs-nav { display: flex; gap: 8px; margin-bottom: 28px; }
  .tab-btn { padding: 7px 18px; border-radius: 8px; border: 1px solid #d0cfc8; background: transparent; color: #6b6a63; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .tab-btn.active { background: #f0efea; border-color: #a0a099; color: #1a1a18; }
  .panel { display: none; }
  .panel.active { display: block; }

  .section-label { font-size: 11px; color: #6b6a63; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }

  .role-tabs { display: flex; gap: 8px; margin-bottom: 28px; }
  .role-tab { flex: 1; padding: 9px 0; border-radius: 8px; border: 1.5px solid #d0cfc8; background: transparent; color: #6b6a63; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .18s; }
  .role-tab:hover:not(.active) { border-color: #a0a099; color: #1a1a18; }
  .role-tab.active[data-role="production"]     { background: #E6F1FB; border-color: #185FA5; color: #0C447C; box-shadow: 0 0 0 2px #185FA540; }
  .role-tab.active[data-role="non-production"] { background: #EEEDFE; border-color: #534AB7; color: #3C3489; box-shadow: 0 0 0 2px #534AB740; }
  .role-tab.active[data-role="manager"]        { background: #E1F5EE; border-color: #0F6E56; color: #085041; box-shadow: 0 0 0 2px #0F6E5640; }

  .criteria-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
  .criteria-row { display: flex; align-items: center; gap: 12px; }
  .criteria-name { width: 220px; font-size: 14px; color: #1a1a18; flex-shrink: 0; }
  .score-btns { display: flex; gap: 6px; }
  .score-btn { width: 42px; height: 42px; border-radius: 8px; border: 1.5px solid #d0cfc8; background: transparent; color: #6b6a63; font-size: 15px; font-weight: 500; cursor: pointer; transition: all .18s; }
  .score-btn:hover:not(.selected) { border-color: #a0a099; color: #1a1a18; background: #f0efea; }
  .score-btn.selected[data-val="1"] { background: #F7C1C1; border-color: #A32D2D; color: #501313; font-weight: 700; box-shadow: 0 0 0 2.5px #E24B4A55; }
  .score-btn.selected[data-val="2"] { background: #FAC775; border-color: #854F0B; color: #412402; font-weight: 700; box-shadow: 0 0 0 2.5px #BA751755; }
  .score-btn.selected[data-val="3"] { background: #C0DD97; border-color: #3B6D11; color: #173404; font-weight: 700; box-shadow: 0 0 0 2.5px #63992255; }
  .score-btn.selected[data-val="4"] { background: #5DCAA5; border-color: #085041; color: #04342C; font-weight: 700; box-shadow: 0 0 0 2.5px #1D9E7555; }

  .result-box { border-radius: 12px; border: 1px solid #e0dfd8; padding: 20px 24px; background: #fafaf8; }
  .result-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .result-label { font-size: 13px; color: #6b6a63; margin-bottom: 4px; }
  .result-score { font-size: 38px; font-weight: 600; color: #1a1a18; line-height: 1; }
  .result-band { font-size: 15px; font-weight: 600; margin-top: 8px; }
  .result-desc { font-size: 12px; color: #6b6a63; margin-top: 6px; line-height: 1.5; max-width: 320px; }
  .formula-bar { font-size: 11px; color: #a0a099; font-family: 'SF Mono', 'Consolas', monospace; text-align: right; padding-top: 4px; line-height: 1.8; }
  .b5 { color: #0F6E56; } .b4 { color: #185FA5; } .b3 { color: #3B6D11; } .b2 { color: #854F0B; } .b1 { color: #A32D2D; }

  /* REFERENCE TABLE */
  .ref-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ref-table th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #6b6a63; border-bottom: 1px solid #e0dfd8; }
  .ref-table td { padding: 12px; vertical-align: top; border-bottom: 1px solid #f0efea; color: #1a1a18; line-height: 1.5; }
  .ref-table tr:last-child td { border-bottom: none; }
  .crit-name { font-weight: 600; font-size: 13px; }
  .crit-sub { font-size: 11px; color: #6b6a63; margin-top: 3px; line-height: 1.4; }
  .score-row { display: flex; gap: 7px; align-items: baseline; margin-bottom: 6px; }
  .score-num { font-weight: 700; font-size: 13px; min-width: 14px; }
  .s4 { color: #0F6E56; } .s3 { color: #185FA5; } .s2 { color: #854F0B; } .s1 { color: #A32D2D; }
  .consider-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .consider-list li { display: flex; gap: 7px; font-size: 12px; color: #6b6a63; }
  .consider-list li::before { content: "·"; color: #a0a099; flex-shrink: 0; }

  @media (max-width: 520px) {
    .container { padding: 20px 16px; }
    .criteria-name { width: 160px; font-size: 13px; }
    .score-btn { width: 38px; height: 38px; font-size: 14px; }
    .role-tabs { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Performance Score Calculator</h1>
  <p class="subtitle">Performance review tool — select role type, enter scores, get the result</p>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('calc', this)">Calculator</button>
    <button class="tab-btn" onclick="switchTab('ref', this)">Scoring guide</button>
  </div>

  <div class="panel active" id="panel-calc">
    <div class="section-label">Role type</div>
    <div class="role-tabs">
      <button class="role-tab active" data-role="production"     onclick="setRole('production', this)">Production</button>
      <button class="role-tab"        data-role="non-production" onclick="setRole('non-production', this)">Non-production</button>
      <button class="role-tab"        data-role="manager"        onclick="setRole('manager', this)">Manager</button>
    </div>
    <div class="section-label">Scores (1–4)</div>
    <div class="criteria-grid" id="criteria-grid"></div>
    <div class="result-box">
      <div class="result-top">
        <div>
          <div class="result-label">Performance score</div>
          <div class="result-score" id="result-score">—</div>
          <div class="result-band" id="result-band"></div>
          <div class="result-desc" id="result-desc"></div>
        </div>
        <div class="formula-bar" id="formula-bar">Enter all four scores</div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-ref">
    <table class="ref-table">
      <thead>
        <tr>
          <th style="width:22%">Criteria</th>
          <th style="width:42%">Scale 1–4</th>
          <th style="width:36%">Consider</th>
        </tr>
      </thead>
      <tbody id="ref-tbody"></tbody>
    </table>
  </div>
</div>

<script>
const CRITERIA_CALC = [
  { key: 'ca',  label: 'Contribution / Achievements' },
  { key: 'dev', label: 'Development' },
  { key: 'fb',  label: 'Feedback' },
  { key: 'pot', label: 'Potential' },
];
const WEIGHTS = {
  'production':     { ca: 0.40, dev: 0.30, fb: 0.20, pot: 0.10 },
  'non-production': { ca: 0.30, dev: 0.30, fb: 0.30, pot: 0.10 },
  'manager':        { ca: 0.35, dev: 0.25, fb: 0.25, pot: 0.15 },
};
const BANDS = [
  { min: 3.5,  max: 4.0,  label: 'Outstanding Result', cls: 'b5', desc: 'The employee consistently demonstrates high performance across all criteria.' },
  { min: 3.0,  max: 3.49, label: 'Good Level',         cls: 'b4', desc: 'The employee is stable, showing strength in key areas. Development can focus on one or two zones.' },
  { min: 2.5,  max: 2.99, label: 'Average Level',      cls: 'b3', desc: 'Potential is present, but some areas require focused improvement.' },
  { min: 2.0,  max: 2.49, label: 'Below Average',      cls: 'b2', desc: 'All areas require focused improvement.' },
  { min: 0,    max: 1.99, label: 'Low Effectiveness',  cls: 'b1', desc: 'Task reassignment or motivation work is required.' },
];
const REF_DATA = [
  {
    name: 'Contribution / Achievements',
    sub: 'Contribution to project, team or business outcomes',
    scores: [
      { n:4, cls:'s4', text:'Exceeds expectations; high impact and contribution' },
      { n:3, cls:'s3', text:'Solid and consistent performance' },
      { n:2, cls:'s2', text:'Efforts are visible, but improvement is needed' },
      { n:1, cls:'s1', text:'Significant gaps; low performance' },
    ],
    consider: ['Quantity and quality of completed work','Proactivity in reaching goals','Complexity of tasks handled','Business or team impact'],
  },
  {
    name: 'Development',
    sub: 'Professional growth, skill improvement, learning ability',
    scores: [
      { n:4, cls:'s4', text:'Fast growth, strong learning mindset, surpassing expectations' },
      { n:3, cls:'s3', text:'Steady development and application of new skills' },
      { n:2, cls:'s2', text:'Some growth, but inconsistent or slow' },
      { n:1, cls:'s1', text:'No visible development or growth' },
    ],
    consider: ['Learning new tools, technologies, or methods','Progress in soft or leadership skills','Application of new knowledge','Initiative in personal development'],
  },
  {
    name: 'Feedback',
    sub: 'Overall performance quality and behavior, based on your feedback and input from peers or clients',
    scores: [
      { n:4, cls:'s4', text:'Strong positive influence, high professionalism and maturity' },
      { n:3, cls:'s3', text:'Consistently good quality of work and collaboration' },
      { n:2, cls:'s2', text:'Some concerns, generally meets minimum expectations' },
      { n:1, cls:'s1', text:'Frequent issues with performance or behavior' },
    ],
    consider: ['Timeliness and accuracy of deliverables','Team collaboration and communication','Openness to feedback and ability to act on it','Accountability and initiative'],
  },
  {
    name: 'Potential',
    sub: 'Readiness and ability to grow into more responsibility or a higher role',
    scores: [
      { n:4, cls:'s4', text:'High potential, could be promoted or upskilled now' },
      { n:3, cls:'s3', text:'Demonstrates readiness for the next step within 12–18 months' },
      { n:2, cls:'s2', text:'Shows some potential but requires considerable development' },
      { n:1, cls:'s1', text:'Limited potential, best fit in current role' },
    ],
    consider: ['Strategic thinking and problem solving','Ownership and initiative','Leadership capabilities','Motivation and aspiration for growth'],
  },
];

let role = 'production';
let scores = { ca: null, dev: null, fb: null, pot: null };

function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

function setRole(r, btn) {
  role = r;
  document.querySelectorAll('.role-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
  recalc();
}

function setScore(key, val) {
  scores[key] = val;
  document.querySelectorAll('.score-btn[data-key="' + key + '"]').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.val) === val);
  });
  recalc();
}

function renderGrid() {
  const grid = document.getElementById('criteria-grid');
  grid.innerHTML = CRITERIA_CALC.map(c =>
    '<div class="criteria-row">' +
      '<div class="criteria-name">' + c.label + '</div>' +
      '<div class="score-btns">' +
        [1,2,3,4].map(v =>
          '<button class="score-btn' + (scores[c.key]===v?' selected':'') + '" data-key="' + c.key + '" data-val="' + v + '" onclick="setScore(\'' + c.key + '\',' + v + ')">' + v + '</button>'
        ).join('') +
      '</div>' +
    '</div>'
  ).join('');
}

function recalc() {
  const w = WEIGHTS[role];
  const keys = ['ca','dev','fb','pot'];
  const allSet = keys.every(k => scores[k] !== null);
  const scoreEl = document.getElementById('result-score');
  const bandEl  = document.getElementById('result-band');
  const descEl  = document.getElementById('result-desc');
  const frmEl   = document.getElementById('formula-bar');
  if (!allSet) {
    scoreEl.textContent = '—';
    bandEl.textContent = ''; bandEl.className = 'result-band';
    descEl.textContent = ''; frmEl.textContent = 'Enter all four scores';
    return;
  }
  const total = keys.reduce((s, k) => s + scores[k] * w[k], 0);
  scoreEl.textContent = total.toFixed(2);
  const band = BANDS.find(b => total >= b.min && total <= b.max) || BANDS[BANDS.length-1];
  bandEl.textContent = band.label; bandEl.className = 'result-band ' + band.cls;
  descEl.textContent = band.desc;
  frmEl.textContent = keys.map(k => scores[k] + '×' + w[k]).join(' + ') + ' = ' + total.toFixed(2);
}

function renderRef() {
  const tbody = document.getElementById('ref-tbody');
  tbody.innerHTML = REF_DATA.map(r =>
    '<tr>' +
      '<td><div class="crit-name">' + r.name + '</div><div class="crit-sub">' + r.sub + '</div></td>' +
      '<td>' + r.scores.map(s => '<div class="score-row"><span class="score-num ' + s.cls + '">' + s.n + '</span><span style="font-size:12px;color:#6b6a63">' + s.text + '</span></div>').join('') + '</td>' +
      '<td><ul class="consider-list">' + r.consider.map(c => '<li>' + c + '</li>').join('') + '</ul></td>' +
    '</tr>'
  ).join('');
}

renderGrid();
recalc();
renderRef();
</script>
</body>
</html>
